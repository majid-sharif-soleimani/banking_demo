name: bank-cards

on:
  push:
    paths:
      - "core_banking/bank-cards/**"
      - "core_banking/bank-contracts/**"
      - "core_banking/bank-platform/src/Bank.ServiceDefaults/**"
      - ".github/workflows/bank-cards.yml"
  pull_request:
    paths:
      - "core_banking/bank-cards/**"
      - "core_banking/bank-contracts/**"
      - "core_banking/bank-platform/src/Bank.ServiceDefaults/**"
      - ".github/workflows/bank-cards.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core_banking/bank-cards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The local feed is gitignored: build the shared Bank.* packages from this commit into it. Nothing is published.
      - run: mkdir -p ../.local-feed
      - run: dotnet pack ../bank-contracts -c Release -o ../.local-feed
      - run: dotnet pack ../bank-platform/src/Bank.ServiceDefaults -c Release -o ../.local-feed
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests start PostgreSQL with Testcontainers (Docker is preinstalled on ubuntu-latest).
      - run: dotnet test --no-build -c Release

  image:
    # Builds the linux-arm64 image (for the t4g instance) with the SDK's container support and pushes it to
    # ghcr.io/<repository owner>/bank-cards, on master only. Disabled until Majid sets the repository variable
    # PUBLISH_IMAGES to "true" (bank-platform ADR 0003).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.PUBLISH_IMAGES == 'true'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: core_banking/bank-cards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: mkdir -p ../.local-feed
      - run: dotnet pack ../bank-contracts -c Release -o ../.local-feed
      - run: dotnet pack ../bank-platform/src/Bank.ServiceDefaults -c Release -o ../.local-feed
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          dotnet publish src/Bank.Cards.Api -c Release --os linux --arch arm64 /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository_owner }}/bank-cards
          -p:ContainerImageTags='"latest;${{ github.sha }}"'
