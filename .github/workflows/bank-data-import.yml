name: bank-data-import

on:
  # The integration test runs the whole AppHost, so a change in any service, the gateway or the platform can break it.
  push:
    paths:
      - "core_banking/bank-data-import/**"
      - "core_banking/bank-*/src/**"
      - "core_banking/bank-platform/**"
      - "core_banking/bank-contracts/**"
      - ".github/workflows/bank-data-import.yml"
  pull_request:
    paths:
      - "core_banking/bank-data-import/**"
      - "core_banking/bank-*/src/**"
      - "core_banking/bank-platform/**"
      - "core_banking/bank-contracts/**"
      - ".github/workflows/bank-data-import.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core_banking/bank-data-import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The local feed is gitignored: build the shared Bank.* packages from this commit into it. Nothing is published.
      - run: dotnet pack ../bank-contracts -c Release -o ../.local-feed
      - run: dotnet pack ../bank-platform/src/Bank.ServiceDefaults -c Release -o ../.local-feed
      # The integration test starts the whole AppHost, which serves HTTPS internally.
      - run: dotnet dev-certs https
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests start PostgreSQL with Testcontainers (Docker is preinstalled on ubuntu-latest).
      - run: dotnet test --no-build -c Release
