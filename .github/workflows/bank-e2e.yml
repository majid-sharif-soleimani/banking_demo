name: bank-e2e

# The end-to-end scenarios (bank-platform/tests/Bank.EndToEndTests): the whole AppHost, several minutes. They run only
# on demand, before a demo or a merge into master; every push runs each service's own tests instead (bank-platform ADR 0003).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core_banking/bank-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The local feed is gitignored: build the shared Bank.* packages from this commit into it. Nothing is published.
      - run: dotnet pack ../bank-contracts -c Release -o ../.local-feed
      - run: dotnet pack src/Bank.ServiceDefaults -c Release -o ../.local-feed
      - run: dotnet dev-certs https
      - run: dotnet test tests/Bank.EndToEndTests -c Release
      # Each scenario keeps every service's log; keep them when a scenario fails.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: core_banking/bank-platform/tests/Bank.EndToEndTests/bin/Release/net10.0/e2e-logs/
