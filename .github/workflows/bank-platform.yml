name: bank-platform

on:
  push:
    paths:
      - "core_banking/bank-platform/**"
      - "core_banking/bank-operations/src/**"
      - "core_banking/bank-customers/src/**"
      - "core_banking/bank-accounts/src/**"
      - "core_banking/bank-lending/src/**"
      - "core_banking/bank-cards/src/**"
      - "core_banking/bank-ledger/src/**"
      - ".github/workflows/bank-platform.yml"
  pull_request:
    paths:
      - "core_banking/bank-platform/**"
      - "core_banking/bank-operations/src/**"
      - "core_banking/bank-customers/src/**"
      - "core_banking/bank-accounts/src/**"
      - "core_banking/bank-lending/src/**"
      - "core_banking/bank-cards/src/**"
      - "core_banking/bank-ledger/src/**"
      - ".github/workflows/bank-platform.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core_banking/bank-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The AppHost builds the services it starts, and they reference the shared Bank.* packages. The local feed is
      # gitignored, so build those packages from this commit into it. Nothing is published.
      - run: dotnet pack ../bank-contracts -c Release -o ../.local-feed
      - run: dotnet pack src/Bank.ServiceDefaults -c Release -o ../.local-feed
      # The AppHost serves its internal endpoints over HTTPS; the tests need a development certificate.
      - run: dotnet dev-certs https
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Starts the AppHost with Docker (preinstalled on ubuntu-latest): PostgreSQL, Kafka, Kafka UI, Mailpit.
      - run: dotnet test --no-build -c Release
