# The AWS stack (docker-compose.aws.yml) on a private host machine instead of EC2: images built locally, uploaded files
# inside the Customers container instead of S3, and the gateway only on 127.0.0.1 (Tailscale forwards to it).
# How to use it: deploy/home-hosting.md.
#
#   docker compose -f docker-compose.aws.yml -f docker-compose.home.yml up -d --wait

# The bank's logs also go to Seq on the host machine, in the group banking-demo (bank-platform ADR 0005). HTTP client, Polly and
# YARP lines stay out: one call through the gateway would otherwise write several of them.
x-seq-logs: &seq-logs
  OTEL_RESOURCE_ATTRIBUTES: log_group=banking-demo
  Seq__ServerUrl: http://host.docker.internal:5341
  Logging__LogLevel__System.Net.Http.HttpClient: Warning
  Logging__LogLevel__Polly: Warning
  Logging__LogLevel__Yarp: Warning
x-seq-host: &seq-host ["host.docker.internal:host-gateway"]

services:
  operations:
    image: bank-operations:home
    environment: *seq-logs
    extra_hosts: *seq-host
  customers:
    image: bank-customers:home
    environment:
      <<: *seq-logs
      Files__Provider: Local
      # The app user's home in the .NET base image, writable without a volume. Lost when the container is recreated.
      Files__Root: /home/app/files
    extra_hosts: *seq-host
  accounts:
    image: bank-accounts:home
    environment: *seq-logs
    extra_hosts: *seq-host
  cards:
    image: bank-cards:home
    environment: *seq-logs
    extra_hosts: *seq-host
  lending:
    image: bank-lending:home
    environment: *seq-logs
    extra_hosts: *seq-host
  ledger:
    image: bank-ledger:home
    environment: *seq-logs
    extra_hosts: *seq-host
  identity:
    image: bank-identity:home
    environment: *seq-logs
    extra_hosts: *seq-host
  # Phase 2: the agent host with the chat UI (phase 2 design plan, decision A13: on the host machine, not on AWS). It reaches
  # the bank only through the gateway, with the gateway's key, and keeps chats in schema "agent".
  agent:
    image: bank-agent:home
    restart: unless-stopped
    networks: [bank]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: agent
      OTEL_RESOURCE_ATTRIBUTES: log_group=agent
      Seq__ServerUrl: http://host.docker.internal:5341
      services__gateway__http__0: http://gateway:8080
      services__bank-mcp__http__0: http://bank-mcp:8080
    # Seq runs on the host machine, outside this network (home-hosting.md, "Logs in Seq").
    extra_hosts: ["host.docker.internal:host-gateway"]
    # ConnectionStrings__agent-db, Agent__Gateway__ApiKey and Agent__Model__ApiKey (home-hosting.md, "The chat").
    env_file: [{ path: env/agent.env, required: false }]
    ports:
      # This machine only for now; Tailscale publishes it once the chat replaces the gateway there.
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      gateway: { condition: service_started }
      bank-mcp: { condition: service_started }
  # Phase 2 stage 2: the bank MCP server, the bank's tools for the agent. Only on the bank network (no ports): the agent
  # host is its only client. It calls the gateway with the gateway's key and the token the agent host passes on.
  bank-mcp:
    image: bank-mcp:home
    restart: unless-stopped
    networks: [bank]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: bank-mcp
      OTEL_RESOURCE_ATTRIBUTES: log_group=agent
      Seq__ServerUrl: http://host.docker.internal:5341
      services__gateway__http__0: http://gateway:8080
    extra_hosts: ["host.docker.internal:host-gateway"]
    # BankMcp__Gateway__ApiKey (home-hosting.md, "The chat").
    env_file: [{ path: env/bank-mcp.env, required: false }]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      gateway: { condition: service_started }
  gateway:
    image: bank-gateway:home
    environment: *seq-logs
    extra_hosts: *seq-host
    # Replaces the AWS mapping (all interfaces): only this machine, and Tailscale, can reach it.
    ports: !override
      - "127.0.0.1:8080:8080"
